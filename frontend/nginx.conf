server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fotos del tablero enviadas desde el simulador
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # DNS interno de Docker: el nombre "backend" se resuelve en cada peticion,
    # asi nginx arranca aunque el backend todavia no exista (responde 502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Permite SSE si el backend lo usa para la conversacion
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 3s;
    }

    # Archivos con hash en el nombre: cache larga
    location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta cae en index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
